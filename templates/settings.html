<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - 竞彩足球智能分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="light"]{
  --bg:#f5f6fa;--card-bg:#fff;--border:#e5e7eb;--text:#1f2937;--text-muted:#6b7280;--text-light:#9ca3af;
  --home:#2563eb;--away:#ea580c;--accent:#7c3aed;--high:#16a34a;--high-bg:#dcfce7;--low:#dc2626;--low-bg:#fee2e2;
  --medium:#d97706;--medium-bg:#fef3c7;--btn-bg:#f3f4f6;--shadow:0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#0f172a;--card-bg:#1e293b;--border:#334155;--text:#e2e8f0;--text-muted:#94a3b8;--text-light:#64748b;
  --home:#60a5fa;--away:#f97316;--accent:#a78bfa;--high:#22c55e;--high-bg:#064e3b;--low:#ef4444;--low-bg:#450a0a;
  --medium:#f59e0b;--medium-bg:#451a03;--btn-bg:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.header .logo{font-size:1.2rem;font-weight:700;color:var(--home);letter-spacing:1px;cursor:pointer;text-decoration:none}
.header .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-link{background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:0.8rem;text-decoration:none;transition:all .15s}
.nav-link:hover{background:var(--home);color:#fff;border-color:var(--home)}
.nav-link.active{background:var(--home);color:#fff;border-color:var(--home)}
.container{max-width:820px;margin:0 auto;padding:24px}
.section-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;padding-left:10px;border-left:3px solid var(--home)}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.95rem;display:flex;align-items:center;gap:8px}
.card-body{padding:18px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-light,var(--border));flex-wrap:wrap}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:0.9rem;font-weight:500}
.setting-desc{font-size:0.72rem;color:var(--text-muted);margin-top:3px}
select,button.option-btn{background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:6px;font-size:0.85rem;cursor:pointer;transition:all .15s}
select:hover{border-color:var(--home)}
.toggle-track{position:relative;width:44px;height:24px;border-radius:12px;background:var(--btn-bg);border:1px solid var(--border);cursor:pointer;transition:all .2s;flex-shrink:0}
.toggle-track.on{background:var(--home);border-color:var(--home)}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle-track.on .toggle-knob{left:22px}
.num-input{background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:0.85rem;width:90px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-btn{background:var(--btn-bg);color:var(--text-muted);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;transition:all .15s}
.radio-btn:hover{border-color:var(--home)}
.radio-btn.active{background:var(--home);color:#fff;border-color:var(--home)}
.btn-save{background:var(--home);color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer;font-size:0.88rem;font-weight:600;margin-top:6px;transition:all .15s}
.btn-save:hover{opacity:.9}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 22px;border-radius:6px;font-size:0.85rem;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;z-index:200;pointer-events:none}
.toast.show{opacity:1}
.data-source-note{font-size:0.72rem;color:var(--text-light);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="header">
  <a class="logo" href="/">&#9917; 竞彩智析</a>
  <div class="nav">
    <a class="nav-link" href="/">今日赛事</a>
    <a class="nav-link" href="/history">历史战绩</a>
    <a class="nav-link active" href="/settings">系统设置</a>
    <button class="nav-link" onclick="toggleTheme()">&#127769;</button>
  </div>
</div>

<div class="container">
  <div class="section-title">&#9881; 系统设置</div>

  <div class="card">
    <div class="card-head">&#128202; 数据源</div>
    <div class="card-body">
      <div class="setting-row">
        <div><div class="setting-label">数据来源</div><div class="setting-desc">用于实时数据接口 /api/realtime 的默认数据源</div></div>
        <div class="radio-group" id="sourceGroup">
          <button class="radio-btn active" data-src="sporttery">竞彩官方</button>
          <button class="radio-btn" data-src="bzzoiro">Bzzoiro</button>
        </div>
      </div>
      <div class="data-source-note">&#9432; 数据源保存在本地浏览器 (localStorage)，仅影响你的浏览设置。竞彩官方为中国体育彩票真实赔率，Bzzoiro 为第三方扩展数据源。</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">&#128260; 自动刷新</div>
    <div class="card-body">
      <div class="setting-row">
        <div><div class="setting-label">启动自动刷新</div><div class="setting-desc">今日赛事页每 <strong id="intervalVal">2</strong> 分钟自动拉取最新数据</div></div>
        <div class="toggle-track" id="autoToggle" onclick="toggleAuto(this)"><div class="toggle-knob"></div></div>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">刷新间隔（分钟）</div><div class="setting-desc">自动刷新频率</div></div>
        <input class="num-input" id="intervalInput" type="number" min="1" max="60" value="2" onchange="onIntervalChange()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">&#127921; 主题</div>
    <div class="card-body">
      <div class="setting-row">
        <div><div class="setting-label">界面主题</div><div class="setting-desc">深色/浅色切换</div></div>
        <button class="option-btn" id="themeBtn" onclick="toggleTheme()">切换</button>
      </div>
    </div>
  </div>

  <button class="btn-save" onclick="saveSettings()">保存设置</button>
</div>

<div class="toast" id="toast">设置已保存</div>

<script>
let settings = { dataSource:'sporttery', autoRefresh:true, refreshInterval:2 };

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
(function(){
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();

function loadSettings(){
  try{
    const raw = localStorage.getItem('app-settings');
    if(raw) settings = Object.assign(settings, JSON.parse(raw));
  }catch(e){}
  const src = settings.dataSource || 'sporttery';
  document.querySelectorAll('.radio-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.src === src);
  });
  const auto = document.getElementById('autoToggle');
  if(auto.classList.contains('on') !== !!settings.autoRefresh) toggleAuto(auto, true);
  document.getElementById('intervalInput').value = settings.refreshInterval || 2;
  document.getElementById('intervalVal').textContent = settings.refreshInterval || 2;
}

function setSource(btn){
  settings.dataSource = btn.dataset.src;
  document.querySelectorAll('.radio-btn').forEach(b=>b.classList.toggle('active', b===btn));
}
document.querySelectorAll('.radio-btn').forEach(b=>b.addEventListener('click', ()=>setSource(b)));

function toggleAuto(el, force){
  let on = el.classList.contains('on');
  if(force === undefined) on = !on;
  else on = !!force;
  el.classList.toggle('on', on);
  settings.autoRefresh = on;
}
function onIntervalChange(){
  let val = parseInt(document.getElementById('intervalInput').value) || 2;
  val = Math.max(1, Math.min(60, val));
  document.getElementById('intervalInput').value = val;
  settings.refreshInterval = val;
  document.getElementById('intervalVal').textContent = val;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg || '设置已保存';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function saveSettings(){
  localStorage.setItem('app-settings', JSON.stringify(settings));
  showToast('设置已保存');
}
loadSettings();
</script>
</body>
</html>
