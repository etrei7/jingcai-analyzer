<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞彩足球智能分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="light"]{
  --bg:#f5f6fa;--card-bg:#fff;--card-hover:#f8f9fb;--border:#e5e7eb;--border-light:#f0f1f3;
  --text:#1f2937;--text-muted:#6b7280;--text-light:#9ca3af;
  --home:#2563eb;--away:#ea580c;--accent:#7c3aed;
  --high:#16a34a;--high-bg:#dcfce7;--medium:#d97706;--medium-bg:#fef3c7;--low:#dc2626;--low-bg:#fee2e2;
  --over:#ea580c;--under:#2563eb;--balance:#6b7280;
  --btn-bg:#f3f4f6;--btn-hover:#e5e7eb;--odds-sel:#dbeafe;--odds-sel-border:#2563eb;
  --panel-bg:#fff;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 16px rgba(0,0,0,.12);
  --card-stripe:#f9fafb;--tag-bg:#f3f4f6;
  --modal-bg:#fff;--modal-overlay:rgba(0,0,0,.45);
  --bar-track:#e5e7eb;
}
[data-theme="dark"]{
  --bg:#0f172a;--card-bg:#1e293b;--card-hover:#253349;--border:#334155;--border-light:#2d3a4e;
  --text:#e2e8f0;--text-muted:#94a3b8;--text-light:#64748b;
  --home:#60a5fa;--away:#f97316;--accent:#a78bfa;
  --high:#22c55e;--high-bg:#064e3b;--medium:#f59e0b;--medium-bg:#451a03;--low:#ef4444;--low-bg:#450a0a;
  --over:#f97316;--under:#60a5fa;--balance:#94a3b8;
  --btn-bg:#334155;--btn-hover:#475569;--odds-sel:#1e3a5f;--odds-sel-border:#60a5fa;
  --panel-bg:#1e293b;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 20px rgba(0,0,0,.5);
  --card-stripe:#1a2436;--tag-bg:#334155;
  --modal-bg:#1e293b;--modal-overlay:rgba(0,0,0,.7);
  --bar-track:#334155;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:var(--card-bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.header .logo{font-size:1.2rem;font-weight:700;color:var(--home);letter-spacing:1px}
.header .stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.header .stat-item{font-size:0.8rem;color:var(--text-muted)}
.header .stat-item span{color:var(--text);font-weight:600;margin-left:3px}
.header .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;margin-right:3px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-refresh{background:var(--home);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:0.8rem;font-weight:500}
.btn-theme{background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:0.75rem}
.main-container{display:flex;gap:20px;padding:18px 24px;max-width:1400px;margin:0 auto}
.content-area{flex:1;min-width:0;margin-right:340px}
.section-title{font-size:1rem;font-weight:700;margin-bottom:12px;padding-left:10px;border-left:3px solid var(--home)}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px}
.filter-btn{background:var(--btn-bg);color:var(--text-muted);border:1px solid var(--border);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:0.72rem;transition:all .15s;white-space:nowrap}
.filter-btn:hover,.filter-btn.active{background:var(--home);color:#fff;border-color:var(--home)}
.filter-select{background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:0.72rem;cursor:pointer}
.match-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow);transition:all .15s}
.match-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.match-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.match-meta{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.match-id{background:#eff6ff;color:var(--home);padding:3px 10px;border-radius:5px;font-size:0.78rem;font-weight:700}
.match-league{font-size:0.8rem;color:var(--text-muted)}
.league-q{font-size:0.62rem;padding:1px 5px;border-radius:3px;font-weight:600}
.league-q.t1{background:#dcfce7;color:#166534}.league-q.t2{background:#fef3c7;color:#92400e}.league-q.t3{background:#fee2e2;color:#991b1b}
.match-time{font-size:0.8rem;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.derby-tag{background:#fef3c7;color:#92400e;font-size:0.65rem;padding:2px 6px;border-radius:3px;font-weight:600}
.injury-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:2px}
.injury-dot.red{background:var(--low)}.injury-dot.yellow{background:var(--medium)}
.match-content{display:flex;gap:14px;align-items:stretch}
.match-teams{flex:0 0 220px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.team-line{display:flex;align-items:center;gap:6px}
.team-name{font-size:1rem;font-weight:600}
.team-name.home{color:var(--home)}.team-name.away{color:var(--away)}
.rank-badge{font-size:0.68rem;padding:2px 7px;border-radius:10px;font-weight:600}
.rank-badge.top3{background:#dcfce7;color:#166534}.rank-badge.mid{background:#f0fdf4;color:#15803d}
.rank-badge.low{background:#fef3c7;color:#92400e}.rank-badge.bottom{background:#fee2e2;color:#991b1b}
.team-conf{font-size:0.68rem;color:var(--text-muted)}
.team-conf .bar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-right:3px}
.team-conf .bar.green{background:var(--high)}.team-conf .bar.yellow{background:var(--medium)}.team-conf .bar.red{background:var(--low)}
.vs-text{font-size:0.75rem;color:var(--text-light);margin:2px 0}
.match-center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.odds-row{display:flex;gap:6px;flex-wrap:wrap}
.odds-btn{background:var(--btn-bg);color:var(--text);border:2px solid var(--border);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:0.8rem;transition:all .15s;text-align:center;min-width:50px;user-select:none}
.odds-btn:hover{background:var(--odds-sel);border-color:var(--odds-sel-border)}
.odds-btn.selected{background:var(--odds-sel);border-color:var(--odds-sel-border);color:var(--home);font-weight:700}
.odds-btn .label{display:block;font-size:0.62rem;color:var(--text-muted);margin-bottom:1px}
.odds-btn .val{font-weight:700;font-size:0.9rem}
.odds-section-label{font-size:0.62rem;color:var(--text-muted);margin-bottom:0;text-transform:uppercase;letter-spacing:0.5px}
.market-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.market-bar-wrap{display:flex;align-items:center;gap:3px;flex:1;min-width:60px}
.market-bar-label{font-size:0.62rem;color:var(--text-muted);width:14px;text-align:center}
.market-bar{flex:1;height:4px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.market-bar-fill{height:100%;border-radius:3px}
.market-bar-fill.win{background:var(--home)}.market-bar-fill.draw{background:#9ca3af}.market-bar-fill.lose{background:var(--away)}
.market-bar-pct{font-size:0.62rem;color:var(--text-muted);width:26px;text-align:right}
.market-tag{font-size:0.68rem;padding:2px 7px;border-radius:4px;white-space:nowrap}
.market-tag.home-tendency{background:var(--odds-sel);color:var(--home)}
.market-tag.away-tendency{background:#fff7ed;color:var(--away)}
.market-tag.draw-tendency{background:var(--tag-bg);color:var(--balance)}
.market-tag.balanced{background:#f0fdf4;color:#166534}
.match-extras{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:0.68rem;color:var(--text-muted)}
.extras-item{display:flex;align-items:center;gap:3px;background:var(--card-stripe);padding:2px 7px;border-radius:4px}
.extras-item .icon{font-size:0.8rem}
.extras-item.ref{color:var(--accent)}.extras-item.weather{color:#0891b2}
.extras-item.na{color:var(--text-light);opacity:.7}
.match-right{flex:0 0 210px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.tag{padding:2px 7px;border-radius:4px;font-size:0.68rem;font-weight:600;white-space:nowrap}
.tag-high{background:var(--high-bg);color:var(--high)}.tag-medium{background:var(--medium-bg);color:var(--medium)}.tag-low{background:var(--low-bg);color:var(--low)}
.tag-over{background:#fff7ed;color:var(--over)}.tag-under{background:var(--odds-sel);color:var(--under)}.tag-balance{background:var(--tag-bg);color:var(--balance)}
.tag-moderate{background:#fefce8;color:#a16207}.tag-extreme{background:var(--low-bg);color:#b91c1c}.tag-cold{background:var(--odds-sel);color:#1d4ed8}
.conf-breakdown{font-size:0.64rem;color:var(--text-muted);line-height:1.5;display:flex;gap:6px;flex-wrap:wrap}
.conf-breakdown span{background:var(--card-stripe);padding:1px 5px;border-radius:3px}
.detail-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--text-muted);margin-top:8px;user-select:none;padding:3px 0}
.detail-toggle:hover{color:var(--home)}
.detail-toggle .arrow{transition:transform .2s;font-size:0.6rem}
.detail-toggle.open .arrow{transform:rotate(90deg)}
.detail-panel{display:none;margin-top:10px;padding:12px 16px;background:var(--card-stripe);border-radius:8px;border:1px solid var(--border-light)}
.detail-panel.show{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.detail-section h4{font-size:0.78rem;font-weight:700;margin-bottom:6px;color:var(--text)}
.injury-list{list-style:none;font-size:0.72rem}
.injury-list li{padding:3px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;gap:8px}
.injury-list li .player{font-weight:600}
.injury-list li .reason{color:var(--text-muted)}
.injury-list li .tag-injury{background:var(--low-bg);color:#b91c1c;font-size:0.62rem;padding:1px 5px;border-radius:3px}
.goal-dist-bars{display:flex;align-items:flex-end;gap:5px;height:56px;padding-top:8px}
.goal-dist-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.goal-dist-fill{width:100%;border-radius:3px 3px 0 0;transition:height .3s}
.goal-dist-fill.high-dist{background:var(--home)}.goal-dist-fill.mid-dist{background:#93c5fd}.goal-dist-fill.low-dist{background:var(--bar-track)}
.goal-dist-label{font-size:0.58rem;color:var(--text-muted)}
.goal-dist-pct{font-size:0.58rem;color:var(--text);font-weight:600}
.referee-info{font-size:0.72rem}.referee-info .strict{font-weight:600}
.strict-strict{color:#dc2626}.strict-moderate{color:#d97706}.strict-lenient{color:#16a34a}
.na-text{font-size:0.72rem;color:var(--text-light);font-style:italic}
.rec-section{margin-top:30px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.rec-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.rec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rec-name{font-weight:700;font-size:0.85rem}.rec-type{font-size:0.7rem;color:var(--text-muted)}
.rec-risk{font-size:0.65rem;padding:2px 7px;border-radius:4px;font-weight:600}
.rec-risk-low{background:var(--high-bg);color:#166534}.rec-risk-mid{background:var(--medium-bg);color:#92400e}
.rec-logic{font-size:0.65rem;color:var(--text-muted);margin-bottom:6px;padding:4px 8px;background:var(--card-stripe);border-radius:4px;line-height:1.4}
.rec-match-item{background:var(--card-stripe);border-radius:6px;padding:8px 10px;margin-bottom:5px;border-left:3px solid var(--home)}
.rec-match-item .teams{font-weight:600;font-size:0.82rem;margin-bottom:2px}
.rec-match-item .teams .h{color:var(--home)}.rec-match-item .teams .a{color:var(--away)}
.rec-match-item .detail{font-size:0.7rem;color:var(--text-muted);display:flex;gap:6px;flex-wrap:wrap}
.rec-odds-display{text-align:center;margin-top:8px;padding:10px;background:var(--odds-sel);border-radius:6px}
.rec-odds-display .combo{font-size:1.1rem;font-weight:700;color:var(--home)}
.rec-odds-display .ret{font-size:0.75rem;color:var(--text-muted);margin-top:3px}
.tg-section{margin-top:30px}
.tg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tg-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.tg-card .tg-teams{font-weight:600;font-size:0.82rem;margin-bottom:4px}
.tg-card .tg-teams .h{color:var(--home)}.tg-card .tg-teams .a{color:var(--away)}
.tg-card .tg-meta{font-size:0.65rem;color:var(--text-muted);margin-bottom:6px}
.tg-card .tg-picks{display:flex;gap:6px;flex-wrap:wrap}
.tg-pick{background:var(--btn-bg);border:1px solid var(--border);padding:4px 10px;border-radius:6px;text-align:center;cursor:default}
.tg-pick .tg-key{font-weight:700;font-size:0.82rem;color:var(--home)}
.tg-pick .tg-prob{font-size:0.62rem;color:var(--text-muted)}
.parlay-panel{position:fixed;right:20px;top:80px;width:300px;max-height:calc(100vh - 120px);background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;z-index:200;box-shadow:var(--shadow-lg)}
.parlay-panel.collapsed .parlay-list,.parlay-panel.collapsed .parlay-footer{display:none}
.parlay-panel.collapsed{width:auto;min-width:160px}
.parlay-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.parlay-title{font-weight:700;font-size:0.9rem}
.parlay-badge{background:var(--home);color:#fff;font-size:0.68rem;padding:2px 9px;border-radius:10px;min-width:20px;text-align:center}
.parlay-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem;padding:0 3px;line-height:1}
.parlay-toggle:hover{color:var(--text)}
.parlay-close{display:none;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:0 3px;line-height:1}
.parlay-close:hover{color:var(--low)}
@media(max-width:900px){
  .parlay-close{display:inline-block}
  .parlay-panel{transition:transform .3s}
}
.parlay-list{flex:1;overflow-y:auto;padding:6px 12px;max-height:300px}
.parlay-empty{text-align:center;color:var(--text-muted);padding:20px 0;font-size:0.75rem;line-height:1.5}
.parlay-item{background:var(--card-stripe);border-radius:6px;padding:8px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-size:0.75rem}
.parlay-item .info{flex:1;min-width:0}
.parlay-item .match-teams-small{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parlay-item .option-info{color:var(--text-muted);font-size:0.68rem}
.parlay-remove{background:none;border:none;color:var(--low);cursor:pointer;font-size:1.1rem;padding:0 4px}
.parlay-remove:hover{color:#b91c1c;transform:scale(1.2)}
.parlay-footer{padding:10px 16px;border-top:1px solid var(--border)}
.parlay-combo{text-align:center;margin-bottom:8px}
.parlay-combo .val{font-size:1.05rem;font-weight:700;color:var(--home)}
.parlay-combo .label{font-size:0.65rem;color:var(--text-muted)}
.parlay-btns{display:flex;gap:6px}
.btn-clear{flex:1;background:transparent;color:var(--low);border:1px solid var(--low);padding:7px;border-radius:6px;cursor:pointer;font-size:0.78rem}.btn-clear:hover{background:var(--low-bg)}
.btn-generate{flex:1;background:var(--home);color:#fff;border:none;padding:7px;border-radius:6px;cursor:pointer;font-size:0.78rem;font-weight:600}.btn-generate:hover{opacity:.9}.btn-generate:disabled{opacity:.4;cursor:not-allowed}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:300;display:flex;align-items:center;justify-content:center}
.modal-content{background:var(--modal-bg);border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:14px}
.modal-match{background:var(--card-stripe);border-radius:6px;padding:9px 12px;margin-bottom:6px}
.modal-match .teams{font-weight:600}.modal-match .detail{font-size:0.75rem;color:var(--text-muted)}
.modal-summary{text-align:center;margin-top:14px;padding:12px;background:var(--odds-sel);border-radius:8px}
.modal-summary .odds{font-size:1.2rem;font-weight:700;color:var(--home)}
.modal-summary .info{font-size:0.8rem;color:var(--text-muted);margin-top:3px}
.modal-close{display:block;width:100%;margin-top:14px;background:var(--btn-bg);color:var(--text);border:1px solid var(--border);padding:9px;border-radius:6px;cursor:pointer;font-size:0.85rem}
.footer{text-align:center;padding:26px 20px;color:var(--text-muted);font-size:0.73rem;border-top:1px solid var(--border);margin-top:36px;background:var(--card-bg)}
.footer .disclaimer{color:#dc2626;font-weight:500;margin-bottom:5px}
.loading{text-align:center;padding:40px;color:var(--text-muted)}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--home);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-str{letter-spacing:1px;font-size:0.73rem;font-family:monospace}
.form-str .w{color:var(--high)}.form-str .l{color:var(--low)}.form-str .d{color:var(--medium)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
@media(max-width:900px){
  .main-container{padding:10px;padding-bottom:100px}.content-area{margin-right:0}
  .match-content{flex-direction:column;gap:8px}
  .match-teams,.match-center,.match-right{flex:none}
  .rec-grid{grid-template-columns:1fr}.tg-grid{grid-template-columns:1fr}
  .header{padding:8px 12px}.header .stats{gap:8px}
  .parlay-panel{position:fixed;right:0;top:auto;bottom:0;left:0;width:100%;max-height:45vh;border-radius:16px 16px 0 0;border-bottom:none}
  .parlay-panel .parlay-list{max-height:140px}
  .detail-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .match-top{flex-direction:column;gap:4px}
  .odds-btn{padding:4px 7px;min-width:44px;font-size:0.72rem}
  .odds-btn .val{font-size:0.82rem}
  .market-row{flex-direction:column;align-items:flex-start;gap:4px}
  .goal-dist-bars{height:44px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">竞彩足球智能分析</div>
  <div class="stats">
    <div class="stat-item"><span class="dot"></span><span id="liveClock">--:--</span></div>
    <div class="stat-item" style="font-size:0.62rem;color:var(--text-light)">数据：<span id="updateTime">--</span></div>
    <div class="stat-item">赛事：<span id="totalMatches">0</span> 场</div>
    <div class="stat-item" id="sourceTag" style="font-size:0.68rem;color:var(--text-light)">源：<span id="dataSource">--</span></div>
    <div class="stat-item" id="priorityTag" style="display:none"></div>
    <button class="btn-refresh" onclick="refreshData()">手动刷新</button>
    <button class="btn-theme" onclick="toggleTheme()" title="切换深/浅色模式">🌓</button>
  </div>
</div>

<div class="main-container">
  <div class="content-area">
    <div class="section-title">赛事数据看板</div>
    <div class="filter-bar" id="filterBar">
      <span style="font-size:0.68rem;color:var(--text-muted);margin-right:4px">筛选:</span>
      <button class="filter-btn active" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" onclick="setFilter('high')">高信心</button>
      <button class="filter-btn" onclick="setFilter('high_odds')">热门方</button>
      <select class="filter-select" id="leagueFilter" onchange="setLeagueFilter(this.value)">

<script>
const BZZOIRO_API_KEY = "{{ api_key }}";
const BZZOIRO_BASE_URL = "https://sports.bzzoiro.com/api";

let currentMatches = [];
let parlaySelections = {};
let autoRefreshTimer = null;

async function fetchBzzoiroEvents(limit) {
  limit = limit || 15;
  const today = new Date().toISOString().slice(0, 10);
  const dt = new Date(Date.now() + 2 * 86400000);
  const twoDays = dt.toISOString().slice(0, 10);
  const url = BZZOIRO_BASE_URL + '/events/?date_from=' + today + '&date_to=' + twoDays + '&status=notstarted&limit=' + limit;
  const resp = await fetch(url, { headers: { 'Authorization': 'Token ' + BZZOIRO_API_KEY } });
  if (!resp.ok) throw new Error('Bzzoiro events ' + resp.status);
  const data = await resp.json();
  return (data.results || []).slice(0, limit);
}

async function fetchBzzoiroPredictions() {
  const url = BZZOIRO_BASE_URL + '/predictions/?upcoming=true';
  const resp = await fetch(url, { headers: { 'Authorization': 'Token ' + BZZOIRO_API_KEY } });
  if (!resp.ok) { console.warn('Bzzoiro predictions ' + resp.status); return []; }
  const data = await resp.json();
  return data.results || [];
}

var JINGCAI_TOKEN = '';

async function fetchJingcaiList() {
  // 1. 从竞彩页面自动获取最新 token
  if (!JINGCAI_TOKEN) {
    try {
      var pageResp = await fetch('https://m.sporttery.cn/mjc/jsq/zqspf/', {
        headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148' }
      });
      if (pageResp.ok) {
        var html = await pageResp.text();
        var m = html.match(/share_token[=:]\s*["\']?([A-Fa-f0-9\-]{30,50})/);
        if (m) { JINGCAI_TOKEN = m[1]; console.log('Token获取成功'); }
        if (!JINGCAI_TOKEN) {
          var m2 = html.match(/token\s*=\s*["\']([A-Fa-f0-9\-]{30,50})/);
          if (m2) JINGCAI_TOKEN = m2[1];
        }
      }
    } catch(e) { console.warn('Token页无法访问'); }
  }
  if (!JINGCAI_TOKEN) return [];
  
  // 2. 调竞彩官方 API
  var url = 'https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=c&share_token=' + JINGCAI_TOKEN;
  try {
    var resp = await fetch(url, { headers: { 'Referer': 'https://m.sporttery.cn/' } });
    if (!resp.ok) { JINGCAI_TOKEN = ''; return []; }  // token过期，下次重新获取
    var data = await resp.json();
    var value = data.value || {};
    var matchList = value.matchInfoList || [];
    var result = [];
    for (var gi = 0; gi < matchList.length; gi++) {
      var group = matchList[gi];
      var subs = group.subMatchList || [];
      for (var si = 0; si < subs.length; si++) {
        var m = subs[si];
        var had = m.had || {};
        result.push({
          match_id: (group.weekday || '') + (m.matchNum || ''),
          home_team: m.homeTeamAllName || m.homeTeamAbbName || '',
          away_team: m.awayTeamAllName || m.awayTeamAbbName || '',
          league: m.leagueName || m.leagueAbbName || '',
          time: (m.matchTime || '').substring(0, 5),
          win_odds: parseFloat(had.h || 0),
          draw_odds: parseFloat(had.d || 0),
          lose_odds: parseFloat(had.a || 0),
          raw_event_id: (group.weekday || '') + (m.matchNum || ''),
          date: group.businessDate || '',
          source: '竞彩官方'
        });
      }
    }
    console.log('竞彩官方API: ' + result.length + ' 场');
    return result;
  } catch(e) {
    console.warn('竞彩官方API失败: ' + e.message);
    return [];
  }
}


async function fetchData() {
  const resp = await fetch('/api/data');
  if (!resp.ok) throw new Error('Network error');
  return await resp.json();
}

function rankClass(r) { if(!r) return ''; if(r<=3) return 'top3'; if(r<=6) return 'mid'; if(r<=12) return 'low'; return 'bottom'; }
function formStrHTML(f) { if(!f) return ''; return '<span class="form-str">'+f.split('').map(c=>`<span class="${c.toLowerCase()}">${c}</span>`).join('')+'</span>'; }
function confBar(s) { const p=s/10*100; const c=s>=6?'green':s>=4?'yellow':'red'; return `<span class="bar ${c}" style="width:${Math.max(3,p*0.6)}px"></span>`; }
function refStrictClass(s) { if(s.includes('严格')) return 'strict-strict'; if(s.includes('适中')) return 'strict-moderate'; return 'strict-lenient'; }
function leagueQualityTag(league) {
  const tier1 = ['英超','西甲','德甲','意甲','法甲','欧冠','欧联','欧协联'];
  const tier2 = ['英冠','德乙','法乙','西乙','意乙','荷甲','葡超','土超','巴甲','日职','韩K联','MLS','阿甲'];
  if(tier1.includes(league)) return '<span class="league-q t1">深数据</span>';
  if(tier2.includes(league)) return '<span class="league-q t2">中数据</span>';
  return '<span class="league-q t3">浅数据</span>';
}

function renderGoalDist(dist) {
  if(!dist) return '<span class="na-text">暂无分布数据</span>';
  const keys = [0,1,2,3,4,5,'6','7+'];
  const maxVal = Math.max(...keys.map(k=>dist[k]||0), 1);
  return '<div class="goal-dist-bars">'+keys.map(k=>{
    const v = dist[k]||0; const h = Math.max(3, v/maxVal*100);
    const cls = v>18?'high-dist':v>8?'mid-dist':'low-dist';
    return `<div class="goal-dist-bar"><span class="goal-dist-pct">${v}%</span><div class="goal-dist-fill ${cls}" style="height:${h}%"></div><span class="goal-dist-label">${k}球</span></div>`;
  }).join('')+'</div>';
}

function renderInjuries(inj) {
  if(!inj) return '<span class="na-text">无伤停报告</span>';
  const h = inj.home || [], a = inj.away || [];
  if(!h.length && !a.length) return '<span class="na-text">无伤停球员</span>';
  let html = '';
  if(h.length) html += '<div style="margin-bottom:6px"><strong style="color:var(--home);font-size:0.72rem">主队伤停 ('+h.length+'人)：</strong><ul class="injury-list">'+h.map(p=>`<li><span class="player">${p.name}</span><span class="reason">${p.reason_cn||p.reason||'未知'}</span><span class="tag-injury">${p.status_cn||'伤停'}</span></li>`).join('')+'</ul></div>';
  if(a.length) html += '<div><strong style="color:var(--away);font-size:0.72rem">客队伤停 ('+a.length+'人)：</strong><ul class="injury-list">'+a.map(p=>`<li><span class="player">${p.name}</span><span class="reason">${p.reason_cn||p.reason||'未知'}</span><span class="tag-injury">${p.status_cn||'伤停'}</span></li>`).join('')+'</ul></div>';
  return html;
}

function renderReferee(ref) {
  if(!ref || !ref.name || ref.name==='待定' || ref.games===0) return '<span class="na-text">暂无裁判数据</span>';
  return `<div class="referee-info">
    <div>主裁判：<strong>${ref.name}</strong> ${ref.country||''}</div>
    <div>执法场次：${ref.games} 场 | 场均黄牌：<strong class="${refStrictClass(ref.strictness||'')}">${ref.avg_yellows||0}</strong> 张 | 场均红牌：${ref.avg_reds||0} 张</div>
    <div>执法风格：<strong class="${refStrictClass(ref.strictness||'')}">${ref.strictness||'未知'}</strong></div>
  </div>`;
}

function renderWeather(weather, derby, travel) {
  let parts = [];
  const w = weather||{};
  if(w.desc && w.desc!=='未知') parts.push(`天气：${w.desc} ${w.temp!=null?' | '+w.temp+'°C':''} ${w.wind!=null?' | 风速 '+w.wind+' m/s':''}`);
  else parts.push('<span class="na-text">天气：暂无数据</span>');
  if(w.impact && w.impact!=='无明显影响') parts.push(`<span style="color:var(--text-muted)">&#9432; ${w.impact}</span>`);
  if(travel && travel>300) parts.push(`<span style="color:var(--medium)">&#9992; 客队远征 ${travel}km</span>`);
  if(derby) parts.push('<span class="derby-tag">德比战</span>');
  return parts.join('<br>');
}

function renderConfBreakdown(bd, reasons, conf, teamName) {
  if(!bd) return '';
  var items = ['状态','历史交手','伤病','首发轮换'];
  return '<div class="conf-breakdown">'+items.map(k=>{
    var r=reasons?reasons[k]:''; 
    return '<span title="'+r+'">'+k+' '+bd[k]+'</span>';
  }).join('')+' 合计 <strong style="color:var(--home)">'+conf+'/10</strong></div>';
}

function renderDetailPanel(m) {
  const ref = m.referee || {};
  const weather = m.weather || {};
  const inj = m.injuries || {};
  const dist = m.goal_distribution || {};
  const pp = m.poisson_params || {};
  const derby = m.is_derby;
  const travel = m.travel_distance_km;
  const hrs = m.home_reasons || {};
  const ars = m.away_reasons || {};
  const hasInjuries = inj.home_count > 0 || inj.away_count > 0;
  const hasRef = ref.name && ref.name !== '待定' && ref.games > 0;
  const hasWeather = weather.desc && weather.desc !== '未知';
  const canRenderRef = ref.name && ref.name !== '待定';

  return `
  <div class="detail-grid">
    <div class="detail-section">
      <h4>&#9877; 伤停报告</h4>
      ${hasInjuries ? renderInjuries(inj) : '<div style="font-size:0.72rem;color:var(--text-light)">暂无伤停报告 — 数据持续接入中</div>'}
      ${m.injury_impact && m.injury_impact !== '无影响' ? `<div style="margin-top:4px;font-size:0.7rem;color:${m.injury_impact.includes('重大')?'var(--low)':'var(--medium)'}">&#9888; ${m.injury_impact}</div>` : ''}
    </div>
    <div class="detail-section">
      <h4>&#9917; 裁判分析</h4>
      ${renderReferee(ref)}
      ${m.ref_impact ? `<div style="margin-top:3px;font-size:0.68rem;color:var(--text-muted)">&#9432; ${m.ref_impact}</div>` : ''}
    </div>
    <div class="detail-section">
      <h4>&#127788; 天气与场地</h4>
      <div style="font-size:0.72rem">${renderWeather(weather, derby, travel)}</div>
      ${m.venue_name ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-top:3px">场地：${m.venue_name} ${m.venue_city?'('+m.venue_city+')':''} ${m.venue_capacity?' | 容量 '+m.venue_capacity.toLocaleString():''}</div>` : ''}
    </div>
    <div class="detail-section">
      <h4>&#128200; 泊松进球概率分布</h4>
      <div>预期总进球：<strong>${m.expected_goals||'?'} 球</strong> | 大2.5概率：<strong>${m.over25_prob||0}%</strong></div>
      ${pp.lambda_total ? `<div style="font-size:0.62rem;color:var(--text-muted);margin-top:2px">λ=${pp.lambda_total} | 主队攻击力=${pp.home_attack} | 客队攻击力=${pp.away_attack} | 来源：${pp.source||'-'}</div>` : ''}
      ${renderGoalDist(dist)}
    </div>
    <div class="detail-section">
      <h4>&#127922; 球队信心详情 (10分制)</h4>
      <div style="font-size:0.7rem"><span style="color:var(--home);font-weight:600">${m.home_team}</span> ${renderConfBreakdown(m.home_breakdown, m.home_reasons, m.home_confidence, m.home_team)}</div>
      <div style="font-size:0.7rem;margin-top:3px"><span style="color:var(--away);font-weight:600">${m.away_team}</span> ${renderConfBreakdown(m.away_breakdown, m.away_reasons, m.away_confidence, m.away_team)}</div>
      <div style="font-size:0.6rem;color:var(--text-light);margin-top:4px">&#9432; 鼠标悬停各维度查看评分依据</div>
    </div>
    ${m.ai_preview ? `
    <div class="detail-section" style="grid-column:1/-1">
      <h4>&#129302; AI 综合分析</h4>
      <div style="font-size:0.72rem;line-height:1.6;color:var(--text-muted);max-height:120px;overflow-y:auto">${m.ai_preview}</div>
    </div>` : ''}
  </div>`;
}

function renderOddsBtn(match, option, odds, mode) {
  const key = mode === 'hcp' ? match.match_id+'_hcp_'+option : match.match_id+'_'+option;
  const sel = parlaySelections[key];
  const isSel = sel && sel.option === option && sel.mode === mode;
  const cls = mode === 'hcp' ? 'odds-btn' : 'odds-btn';
  return `<div class="${cls}${isSel?' selected':''}" onclick="toggleOdds('${match.match_id}','${option}',${odds},'${match.home_team}','${match.away_team}','${match.league}','${match.match_time}','${mode}')"><span class="label">${option}</span><span class="val">${odds}</span></div>`;
}

function renderPredictionBadge(m) {
  const po = m.predicted_option;
  const mt = m.market_tendency;
  // 优先 AI 预测，其次市场倾向，最后赔率最低方
  var best = po;
  if (!best && mt && mt!=='均衡'){
    if(mt==='主胜') best='胜';
    else if(mt==='客胜') best='负';
    else if(mt==='平局') best='平';
  }
  if (!best){
    const odds=[{k:'胜',v:m.win_odds||99},{k:'平',v:m.draw_odds||99},{k:'负',v:m.lose_odds||99}];
    odds.sort((a,b)=>a.v-b.v);
    if(odds[0].v<1.8) best=odds[0].k;  // only recommend if clear favorite
  }
  if (!best) return '';
  const bgColor = best === '胜' ? 'var(--home)' : (best === '平' ? '#9ca3af' : 'var(--away)');
  const txtColor = '#fff';
  return `<span style="background:${bgColor};color:${txtColor};padding:3px 12px;border-radius:6px;font-size:0.78rem;font-weight:700;margin-left:auto;white-space:nowrap">
    推荐${best}
  </span>`;
}

function renderHistoryPanel(stats) {
  const c = document.getElementById('historyContainer');
  if (!stats || stats.total === 0) {
    c.innerHTML = '<div style="padding:12px;background:var(--card-stripe);border-radius:8px;font-size:0.78rem;color:var(--text-muted)">尚未有验证记录，预测将在比赛结束后自动验证并更新命中率</div>';
    return;
  }
  const rate = stats.total_rate || 0;
  const rateColor = rate >= 60 ? 'var(--high)' : rate >= 45 ? 'var(--medium)' : 'var(--low)';
  let recentHtml = '';
  if (stats.recent && stats.recent.length > 0) {
    recentHtml = '<div style="margin-top:8px"><strong style="font-size:0.75rem">近' + stats.recent.length + '场记录：</strong><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">' +
      stats.recent.map(r => `<span style="padding:3px 8px;border-radius:4px;font-size:0.65rem;background:${r.hit?'var(--high-bg)':'var(--low-bg)'};color:${r.hit?'#166534':'#b91c1c'};">${r.teams}:${r.predicted}→${r.actual} ${r.hit?'✓':'✗'}</span>`).join('') +
      '</div></div>';
  }
  c.innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 18px">
      <div style="text-align:center">
        <div style="font-size:1.5rem;font-weight:700;color:${rateColor}">${rate}%</div>
        <div style="font-size:0.65rem;color:var(--text-muted)">命中率</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text)">${stats.hits||0}</div>
        <div style="font-size:0.65rem;color:var(--text-muted)">命中</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text)">${stats.misses||0}</div>
        <div style="font-size:0.65rem;color:var(--text-muted)">未中</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text)">${stats.total||0}</div>
        <div style="font-size:0.65rem;color:var(--text-muted)">已验证</div>
      </div>
    </div>
    ${recentHtml}`;
}

function renderOddsMove(m) {
  const om = m.odds_movement;
  if (!om || !om.trend) return '';
  const t = om.trend;
  const homeMove = t.home||0, drawMove = t.draw||0, awayMove = t.away||0;
  const total = t.total||0;
  if (total < 3) return '';
  const dominant = Math.max(Math.abs(homeMove),Math.abs(drawMove),Math.abs(awayMove));
  if (dominant <= 1) return '<span class="extras-item" title="多家博彩公司赔率稳定，无显著变动">赔率→稳</span>';
  let dir = '';
  if (Math.abs(homeMove) === dominant) dir = homeMove>0?'主跌':'主升';
  else if (Math.abs(drawMove) === dominant) dir = drawMove>0?'平跌':'平升';
  else dir = awayMove>0?'客跌':'客升';
  const cls = dir.includes('跌')?'extras-item':'extras-item';
  return `<span class="${cls}" title="初赔→即赔变动趋势：${t.home>0?'主降'+t.home+'家 ':'主升'+(-t.home)+'家 '} ${t.draw>0?'平降'+t.draw+'家 ':'平升'+(-t.draw)+'家 '} ${t.away>0?'客降'+t.away+'家 ':'客升'+(-t.away)+'家 '}">赔率→${dir}</span>`;
}

function renderPressureTag(m) {
  const om = m.odds_movement;
  if (!om || !om.pressure_side) return '';
  const ps = om.pressure_side;
  if (ps === '资金均衡') return '';
  const cls = ps.includes('主')?'tag-medium':'tag-low';
  return `<div class="tag-row"><span class="tag ${cls}">&#128176; ${ps}</span></div>`;
}

// --- 筛选 & 排序 ---
let currentFilter = 'all';
let currentLeague = 'all';
let currentSort = 'time';
let allMatches = [];

function setFilter(f) { currentFilter=f; updateFilterButtons(); applyFilters(); }
function setLeagueFilter(v) { currentLeague=v; applyFilters(); }
function setSort(v) { currentSort=v; applyFilters(); }

function updateFilterButtons(){
  document.querySelectorAll('.filter-btn').forEach(b=>{
    var f=b.textContent;
    var key=f==='全部'?'all':f==='高信心'?'high':'high_odds';
    b.classList.toggle('active', key===currentFilter);
  });
}

function applyFilters(){
  var filtered=allMatches.slice();
  if(currentFilter==='high') filtered=filtered.filter(m=>m.confidence_level==='高');
  if(currentFilter==='high_odds') filtered=filtered.filter(m=>m.hotness_label==='适度热门'||m.hotness_label==='极端热门');
  if(currentLeague!=='all') filtered=filtered.filter(m=>m.league===currentLeague);
  if(currentSort==='time'){
    // 按时间排序：处理跨天情况 (date字段优先)
    filtered.sort((a,b)=>{
      var da=a.date||'', db=b.date||'';
      if(da!==db) return da.localeCompare(db);
      return (a.match_time||'99:99').localeCompare(b.match_time||'99:99');
    });
  } else if(currentSort==='confidence'){
    filtered.sort((a,b)=>(b.home_confidence+b.away_confidence)/2-(a.home_confidence+a.away_confidence)/2);
  } else if(currentSort==='odds'){
    // 按最低赔率升序（热门在前）
    filtered.sort((a,b)=>{
      var ma=Math.min(a.win_odds||99,a.draw_odds||99,a.lose_odds||99);
      var mb=Math.min(b.win_odds||99,b.draw_odds||99,b.lose_odds||99);
      return ma-mb;
    });
  }
  document.getElementById('filterCount').textContent=filtered.length+'/'+allMatches.length+' 场';
  renderMatchesInternal(filtered);
}

function updateLeagueOptions(){
  var leagues=new Set(allMatches.map(m=>m.league));
  var sel=document.getElementById('leagueFilter');
  sel.innerHTML='<option value="all">全部联赛</option>';
  leagues.forEach(l=>{ var o=document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o); });
}

function renderMatches(matches) {
  allMatches = matches;
  updateLeagueOptions();
  applyFilters();
}

function renderMatchesInternal(matches) {
  currentMatches = matches;
  const c = document.getElementById('matchesContainer');
  if(!matches.length){
    c.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text-muted)"><div style="font-size:3rem;margin-bottom:16px">&#9917;</div><div style="font-size:0.9rem;font-weight:600;margin-bottom:8px">暂无赛事数据</div><div style="font-size:0.75rem">可能原因：竞彩今日未开售 / API 暂时不可用<br>请稍后刷新或检查网络连接</div><button class="btn-refresh" onclick="refreshData()" style="margin-top:16px">重新加载</button></div>';
    return;
  }

  c.innerHTML = matches.map(m => {
    const ouCls = m.over_under_tendency==='大球倾向'?'tag-over':m.over_under_tendency==='小球倾向'?'tag-under':'tag-balance';
    const confCls = m.confidence_level==='高'?'tag-high':m.confidence_level==='中'?'tag-medium':'tag-low';
    const hotCls = m.hotness_label==='适度热门'?'tag-moderate':m.hotness_label==='极端热门'?'tag-extreme':'tag-cold';
    const mtCls = m.market_tendency==='主胜'?'home-tendency':m.market_tendency==='客胜'?'away-tendency':m.market_tendency==='平局'?'draw-tendency':'balanced';
    const hr = m.home_rank?`<span class="rank-badge ${rankClass(m.home_rank)}">#${m.home_rank}</span>`:'';
    const ar = m.away_rank?`<span class="rank-badge ${rankClass(m.away_rank)}">#${m.away_rank}</span>`:'';
    const ref = m.referee||{};
    const weather = m.weather||{};
    const inj = m.injuries||{};
    const hid = m.match_id;
    const hcp = m.handicap_line !== undefined ? m.handicap_line : null;
    const hLabel = m.handicap || '';
    const lqt = leagueQualityTag(m.league);

    return `
    <div class="match-card">
      <div class="match-top">
        <div class="match-meta">
          <span class="match-id">${m.match_id}</span>
          <span class="match-league">${m.league}</span> ${lqt}
          ${m.home_rank?`<span style="font-size:0.68rem;color:var(--text-muted)">排名${m.home_rank}/${m.away_rank}</span>`:''}
          ${m.is_derby?'<span class="derby-tag">德比</span>':''}
          ${renderPredictionBadge(m)}
        </div>
        <div class="match-time">${m.match_time} 开赛</div>
      </div>
      <div class="match-content">
        <div class="match-teams">
          <div class="team-line"><span class="team-name home">${m.home_team}</span>${hr}${inj.home_count>0?`<span class="injury-dot red" title="主队${inj.home_count}人伤停"></span>`.repeat(Math.min(inj.home_count,3)):''}</div>
          <div class="team-conf">${confBar(m.home_confidence)}${m.home_confidence}/10 ${formStrHTML(m.home_form)}</div>
          <div class="vs-text">vs</div>
          <div class="team-line"><span class="team-name away">${m.away_team}</span>${ar}${inj.away_count>0?`<span class="injury-dot red" title="客队${inj.away_count}人伤停"></span>`.repeat(Math.min(inj.away_count,3)):''}</div>
          <div class="team-conf">${confBar(m.away_confidence)}${m.away_confidence}/10 ${formStrHTML(m.away_form)}</div>
        </div>
        <div class="match-center">
          <div class="odds-section-label">胜平负</div>
          <div class="odds-row">
            ${renderOddsBtn(m,'胜',m.win_odds,'spf')}
            ${renderOddsBtn(m,'平',m.draw_odds,'spf')}
            ${renderOddsBtn(m,'负',m.lose_odds,'spf')}
          </div>
          ${hcp !== null && hcp !== 0 ? `<div class="odds-section-label" style="margin-top:4px">${hLabel}</div><div class="odds-row">
            ${renderOddsBtn(m,'让胜',m.handicap_win_odds,'hcp')}
            ${renderOddsBtn(m,'让平',m.handicap_draw_odds,'hcp')}
            ${renderOddsBtn(m,'让负',m.handicap_lose_odds,'hcp')}
          </div>` : ''}
          <div class="market-row">
            <div class="market-bar-wrap"><span class="market-bar-label">主</span><div class="market-bar"><div class="market-bar-fill win" style="width:${m.market_win_pct||0}%"></div></div><span class="market-bar-pct">${m.market_win_pct||0}%</span></div>
            <div class="market-bar-wrap"><span class="market-bar-label">平</span><div class="market-bar"><div class="market-bar-fill draw" style="width:${m.market_draw_pct||0}%"></div></div><span class="market-bar-pct">${m.market_draw_pct||0}%</span></div>
            <div class="market-bar-wrap"><span class="market-bar-label">客</span><div class="market-bar"><div class="market-bar-fill lose" style="width:${m.market_lose_pct||0}%"></div></div><span class="market-bar-pct">${m.market_lose_pct||0}%</span></div>
            <span class="market-tag ${mtCls}">${m.market_tendency==='主胜'||m.market_tendency==='客胜'?'倾向'+m.market_tendency:m.market_tendency==='平局'?'看好平局':m.market_tendency}</span>
            ${m.predicted_option?`<span style="font-size:0.65rem;color:var(--text-muted)">AI:${m.predicted_option}</span>`:''}
          </div>
          <div class="match-extras">
            <span class="extras-item">推荐 ${m.recommended_score}</span>
            <span class="extras-item" title="返奖率=1/(1+溢价)，越低返奖越少。正数=机构抽水，负数=赔率异常">&#9432; 溢价 ${m.overround}%</span>
            ${renderOddsMove(m)}
            ${ref.name && ref.name!=='待定' ? `<span class="extras-item ref" title="裁判">&#9877; ${ref.name}</span>` : `<span class="extras-item na">裁判暂无</span>`}
            ${weather.desc && weather.desc!=='未知' ? `<span class="extras-item weather" title="天气">&#9728; ${weather.desc} ${weather.temp!=null?weather.temp+'°C':''}</span>` : `<span class="extras-item na">天气暂无</span>`}
          </div>
        </div>
        <div class="match-right">
          <div class="tag-row"><span class="tag ${confCls}">${m.confidence_level}信心</span><span class="tag ${ouCls}">${m.over_under_tendency}</span></div>
          <div class="tag-row"><span class="tag ${hotCls}">${m.hotness_label}</span><span class="tag" style="background:var(--tag-bg);color:var(--text-muted)">${m.bookmaker_intent}</span></div>
          ${renderPressureTag(m)}
          <div class="tag-row"><span class="tag" style="background:var(--tag-bg);color:var(--text-muted);font-weight:400">预期 ${m.expected_goals} 球 | 大2.5 ${m.over25_prob||0}%</span></div>
        </div>
      </div>
      <div class="detail-toggle" onclick="toggleDetail(this,'detail_${hid}')"><span class="arrow">&#9654;</span> 展开详情（伤停·裁判·天气·泊松·信心分）</div>
      <div class="detail-panel" id="detail_${hid}">${renderDetailPanel(m)}</div>
    </div>`;
  }).join('');
}

function toggleDetail(el, id) {
  const panel = document.getElementById(id);
  if (!panel) return;
  const isOpen = panel.classList.contains('show');
  panel.classList.toggle('show');
  el.classList.toggle('open');
  el.querySelector('.arrow').innerHTML = isOpen ? '&#9654;' : '&#9660;';
  el.innerHTML = (isOpen ? '&#9654; ' : '&#9660; ') + '展开详情（伤停·裁判·天气·泊松·信心分）';
}

function renderRecommendations(recs) {
  const c = document.getElementById('recContainer');
  if(!recs||!recs.length){c.innerHTML='<div style="text-align:center;padding:30px;color:var(--text-muted)">暂无推荐方案</div>';return}
  c.innerHTML='<div class="rec-grid">'+recs.map(r=>{
    const riskCls=r.risk_level==='低风险'?'rec-risk-low':'rec-risk-mid';
    const co=r.combo_odds||0;
    const riskNote=co<2.5?'(含保底场，稳健型)':co<5?'(中等回报，攻守兼备)':'(高风险高回报，谨慎参考)';
    return `<div class="rec-card">
      <div class="rec-header"><div><div class="rec-name">${r.name}</div><div class="rec-type">${r.plan_type}</div></div><span class="rec-risk ${riskCls}" title="组合赔率${co}${riskNote}">${r.risk_level}${co<2.5?' &#128737;':co<5?' &#127919;':' &#9888;'}</span></div>
      ${r.logic ? `<div class="rec-logic">&#128161; ${r.logic}</div>` : ''}
      ${(r.matches_detail||[]).map(md=>`<div class="rec-match-item">
        <div class="teams"><span class="h">${md.home_team}</span> vs <span class="a">${md.away_team}</span><span style="font-size:0.68rem;color:var(--text-muted);margin-left:5px">${md.league} #${md.match_id}</span>${md.home_rank?'<span style="font-size:0.62rem;color:var(--text-muted);margin-left:3px">排名'+md.home_rank+'/'+md.away_rank+'</span>':''}</div>
        <div class="detail"><span>推荐: <strong style="color:var(--home)">${md.option}</strong> @${md.odds}</span><span>${md.hotness_label} | ${md.bookmaker_intent}</span>${md.market_tendency?'<span>市场: '+md.market_tendency+'</span>':''}${md.injury_impact&&md.injury_impact!=='无影响'?'<span style="color:var(--medium)">'+md.injury_impact+'</span>':''}</div>
      </div>`).join('')}
      <div class="rec-odds-display"><div class="combo">组合赔率 ${r.combo_odds}</div><div class="ret">${r.expected_return} <span style="font-size:0.62rem;color:var(--text-muted)">${riskNote}</span></div></div>
    </div>`;
  }).join('')+'</div>';
}

function renderTotalGoals(tgRecs) {
  const c = document.getElementById('tgContainer');
  if(!tgRecs||!tgRecs.length){c.innerHTML='<div class="loading">暂无总进球分析</div>';return}
  c.innerHTML='<div class="tg-grid">'+tgRecs.map(tg=>{
    const top3 = tg.top3||[];
    return `<div class="tg-card">
      <div class="tg-teams"><span class="h">${tg.home_team}</span> vs <span class="a">${tg.away_team}</span></div>
      <div class="tg-meta">#${tg.match_id} ${tg.league} | ${tg.match_time} | 预期 ${tg.expected_goals} 球 | 大2.5: ${tg.over25_prob}%</div>
      <div class="tg-picks">${top3.map(g=>`<div class="tg-pick"><div class="tg-key">${g.label}</div><div class="tg-prob">概率 ${g.prob}%</div></div>`).join('')}</div>
    </div>`;
  }).join('')+'</div>';
}

function renderParlay() {
  const list=document.getElementById('parlayList'),count=document.getElementById('parlayCount');
  const comboEl=document.getElementById('comboOdds'),btnGen=document.getElementById('btnGenerate');
  const items=Object.values(parlaySelections);count.textContent=items.length;
  if(!items.length){list.innerHTML='<div class="parlay-empty">点击比赛中的赔率按钮添加至串关<br>至少选择2场比赛后生成方案</div>';comboEl.textContent='--';btnGen.disabled=true}
  else{list.innerHTML=items.map(i=>`<div class="parlay-item"><div class="info"><div class="match-teams-small">${i.home_team} vs ${i.away_team}</div><div class="option-info">#${i.match_id} ${i.league} | ${i.option} @${i.odds} ${i.mode==='hcp'?'[让]':''}</div></div><button class="parlay-remove" onclick="removeParlayItem('${i.key}')">&times;</button></div>`).join('');comboEl.textContent=items.reduce((a,i)=>a*i.odds,1).toFixed(2);btnGen.disabled=items.length<2}
  // 不覆盖 allMatches，直接重新渲染当前筛选结果
  applyFilters();
}

function toggleOdds(mid,opt,odds,ht,at,lg,mt,mode){
  const key = mode === 'hcp' ? mid+'_hcp_'+opt : mid+'_'+opt;
  if(parlaySelections[key]&&parlaySelections[key].option===opt) delete parlaySelections[key];
  else parlaySelections[key]={key, match_id:mid,option:opt,odds,home_team:ht,away_team:at,league:lg,match_time:mt,mode};
  renderParlay();
}
function removeParlayItem(key){delete parlaySelections[key];renderParlay()}
function clearParlay(){parlaySelections={};renderParlay()}

function generatePlan(){
  const items=Object.values(parlaySelections);if(items.length<2)return;
  const co=items.reduce((a,i)=>a*i.odds,1),ret=(co*2).toFixed(2);
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-title">串关方案详情</div>
    ${items.map(i=>`<div class="modal-match"><div class="teams"><span style="color:var(--home)">${i.home_team}</span> vs <span style="color:var(--away)">${i.away_team}</span></div><div class="detail">#${i.match_id} ${i.league} | ${i.match_time} | 选择: <strong style="color:var(--home)">${i.option}</strong> @${i.odds} ${i.mode==='hcp'?'[让球]':''}</div></div>`).join('')}
    <div class="modal-summary"><div class="odds">组合赔率: ${co.toFixed(2)}</div><div class="info">投注2元预计返奖: <strong style="color:var(--home)">${ret}元</strong></div><div class="info" style="margin-top:5px;font-size:0.7rem;color:var(--text-muted)">${items.length}串1 组合</div></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>`;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(event){if(event&&event.target!==event.currentTarget)return;document.getElementById('modalOverlay').style.display='none'}

function toggleParlayPanel(){
  document.getElementById('parlayPanel').classList.toggle('collapsed');
}
function closeParlayPanel(){
  document.getElementById('parlayPanel').style.display='none';
  let btn=document.getElementById('parlayReopen');
  if(!btn){
    btn=document.createElement('button');
    btn.id='parlayReopen';
    btn.className='btn-refresh';
    btn.style.cssText='position:fixed;bottom:16px;right:16px;z-index:250;border-radius:50%;width:44px;height:44px;font-size:1.2rem;padding:0';
    btn.innerHTML='&#127922;';
    btn.title='打开串关面板';
    btn.onclick=function(){
      document.getElementById('parlayPanel').style.display='flex';
      btn.remove();
    };
    document.body.appendChild(btn);
  }
}

async function refreshData(){
  try{
    document.getElementById('matchesContainer').innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:10px">加载赛事数据…</p></div>';
    document.getElementById('recContainer').innerHTML='<div class="loading">生成推荐方案…</div>';
    document.getElementById('tgContainer').innerHTML='<div class="loading">分析总进球…</div>';

    var data = null;

    // 并行：竞彩 + Bzzoiro 同时发，Bzzoiro优先展示，竞彩后台覆盖
    if (BZZOIRO_API_KEY) {
      var bzResp = fetch('/api/data').then(function(r){return r.ok?r.json():null}).catch(function(){return null});
      var jcResp = fetchJingcaiList().then(async function(jc){
        if(jc&&jc.length>=3){
          var r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jingcai_matches:jc,client_time:new Date().toISOString()})});
          return r.ok?r.json():null;
        }
        return null;
      }).catch(function(){return null});

      // Bzzoiro 先展示（3-5秒，稳）
      data = await Promise.race([bzResp,new Promise(function(r){setTimeout(function(){r(null)},10000)})]);
      if(data&&data.matches&&data.matches.length>0){
        showData(data);
        // 后台等竞彩覆盖
        var jcData=await Promise.race([jcResp,new Promise(function(r){setTimeout(function(){r(null)},8000)})]);
        if(jcData&&jcData.matches&&jcData.matches.length>0){
          showData(jcData);
        }
        return;
      }
      // Bzzoiro 超时或失败，等竞彩
      data=await jcResp;
    }

    // 兜底
    if(!data){
      try{
        var resp=await fetch('/api/data');
        if(resp.ok) data=await resp.json();
      }catch(e){}
    }
    if(data) showData(data);
    else document.getElementById('matchesContainer').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)"><p>数据加载失败</p><button class="btn-refresh" onclick="refreshData()" style="margin-top:12px">重试</button></div>';
  }catch(err){
    document.getElementById('matchesContainer').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-muted)">加载异常: '+err.message+'<br><button class="btn-refresh" onclick="refreshData()" style="margin-top:8px">重试</button></div>';
  }
}

function showData(data){
  document.getElementById('updateTime').textContent=data.stats.update_time;
  document.getElementById('totalMatches').textContent=data.stats.total_matches;
  document.getElementById('dataSource').textContent=data.stats.source;
  var pri=data.stats.data_priority||'';
  var priTag=document.getElementById('priorityTag');
  if(pri==='primary'){priTag.style.display='inline';priTag.innerHTML='<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-size:0.62rem;font-weight:600">主数据源</span>';}
  else if(pri==='secondary'){priTag.style.display='inline';priTag.innerHTML='<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-size:0.62rem">备用源</span>';}
  else if(pri==='fallback'){priTag.style.display='inline';priTag.innerHTML='<span style="background:#fee2e2;color:#b91c1c;padding:2px 8px;border-radius:4px;font-size:0.62rem">模拟</span>';}
  else{priTag.style.display='none';}
  document.getElementById('dataSource').title=data.stats.data_note||'';
  renderMatches(data.matches);
  renderRecommendations(data.recommendations);
  renderTotalGoals(data.total_goals_recs);
  renderHistoryPanel(data.history_stats);
  renderParlay();
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
(function(){
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
function startAutoRefresh(){if(autoRefreshTimer)clearInterval(autoRefreshTimer);autoRefreshTimer=setInterval(refreshData,60000)}
function startLiveClock(){
  function tick(){
    var now=new Date();
    var h=('0'+now.getHours()).slice(-2);
    var m=('0'+now.getMinutes()).slice(-2);
    var s=('0'+now.getSeconds()).slice(-2);
    document.getElementById('liveClock').textContent=h+':'+m+':'+s;
  }
  tick(); setInterval(tick,1000);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('modalOverlay').style.display='none'});
refreshData().then(startAutoRefresh);
startLiveClock();
</script>
