<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞彩足球智能分析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0f1a;
  --card-bg: #1a1a2e;
  --card-hover: #1e1e35;
  --border: #2a2a45;
  --text: #e0e0e0;
  --text-muted: #8888aa;
  --home: #4a9eff;
  --away: #ff8c42;
  --high: #00c853;
  --medium: #ffd600;
  --low: #ff1744;
  --over: #ff8c42;
  --under: #64b5ff;
  --moderate: #ffd600;
  --extreme: #ff5252;
  --cold: #82b1ff;
  --btn-bg: #2a2a4a;
  --btn-hover: #3a3a5a;
  --odds-hover: rgba(74, 158, 255, 0.2);
  --panel-bg: rgba(20, 20, 40, 0.95);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
}

/* ====== Header / Status Bar ====== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, #12122a 0%, #0f0f1a 100%);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.header .logo { font-size: 1.3rem; font-weight: 700; color: var(--home); letter-spacing: 1px; }
.header .stats { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.header .stat-item { font-size: 0.85rem; color: var(--text-muted); }
.header .stat-item span { color: var(--text); font-weight: 600; margin-left: 4px; }
.header .stat-item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #00c853; margin-right: 4px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.btn-refresh {
  background: var(--btn-bg); color: var(--text); border: 1px solid var(--border);
  padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  transition: all 0.2s;
}
.btn-refresh:hover { background: var(--btn-hover); border-color: var(--home); }

/* ====== Main Layout ====== */
.main-container {
  display: flex; gap: 20px; padding: 20px 24px;
  max-width: 1400px; margin: 0 auto;
}
.content-area { flex: 1; min-width: 0; margin-right: 340px; }

/* ====== Match Cards ====== */
.section-title {
  font-size: 1.1rem; color: var(--text); margin-bottom: 12px;
  padding-left: 10px; border-left: 3px solid var(--home);
}
.match-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 20px;
  margin-bottom: 12px; transition: all 0.2s;
  display: flex; gap: 20px; align-items: stretch;
}
.match-card:hover { background: var(--card-hover); border-color: #3a3a5a; }

.match-left {
  flex: 0 0 220px; display: flex; flex-direction: column; justify-content: center;
  gap: 6px; min-width: 0;
}
.match-meta { display: flex; gap: 8px; align-items: center; }
.match-id { background: #252545; color: var(--home); padding: 2px 8px; border-radius: 4px;
  font-size: 0.8rem; font-weight: 700; }
.match-league { font-size: 0.82rem; color: var(--text-muted); }
.match-teams { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
.match-teams .home { color: var(--home); }
.match-teams .away { color: var(--away); }
.match-teams .vs { color: var(--text-muted); margin: 0 6px; font-weight: 400; font-size: 0.8rem; }
.match-time { font-size: 0.82rem; color: var(--text-muted); }

.match-center {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: 8px; min-width: 0;
}
.odds-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.odds-btn {
  background: #1f1f38; color: var(--text); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  transition: all 0.2s; text-align: center; min-width: 60px;
  position: relative; user-select: none;
}
.odds-btn:hover { background: #2a2a50; border-color: var(--home); transform: translateY(-1px); }
.odds-btn.selected { background: rgba(74, 158, 255, 0.25); border-color: var(--home);
  color: var(--home); font-weight: 700; }
.odds-btn .label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; }
.odds-btn .val { font-weight: 700; font-size: 1.05rem; }

.match-extras { display: flex; gap: 10px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.handicap-badge { background: #252545; padding: 3px 10px; border-radius: 4px;
  font-size: 0.78rem; color: #b0b0d0; }
.rec-score { font-size: 0.78rem; color: var(--text-muted); background: #252545;
  padding: 3px 10px; border-radius: 4px; }

.match-right {
  flex: 0 0 240px; display: flex; flex-direction: column; justify-content: center;
  gap: 6px; flex-wrap: wrap;
}
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
  white-space: nowrap;
}
.tag-high { background: rgba(0,200,83,0.15); color: var(--high); border: 1px solid rgba(0,200,83,0.3); }
.tag-medium { background: rgba(255,214,0,0.12); color: var(--medium); border: 1px solid rgba(255,214,0,0.25); }
.tag-low { background: rgba(255,23,68,0.15); color: var(--low); border: 1px solid rgba(255,23,68,0.3); }
.tag-over { background: rgba(255,140,66,0.15); color: var(--over); border: 1px solid rgba(255,140,66,0.3); }
.tag-under { background: rgba(100,180,255,0.15); color: var(--under); border: 1px solid rgba(100,180,255,0.25); }
.tag-balance { background: rgba(158,158,158,0.12); color: #9e9e9e; border: 1px solid rgba(158,158,158,0.2); }
.tag-moderate { background: rgba(255,214,0,0.1); color: var(--moderate); border: 1px solid rgba(255,214,0,0.2); }
.tag-extreme { background: rgba(255,82,82,0.12); color: var(--extreme); border: 1px solid rgba(255,82,82,0.25); }
.tag-cold { background: rgba(130,177,255,0.1); color: var(--cold); border: 1px solid rgba(130,177,255,0.2); }
.tag-intent-real { background: rgba(0,200,83,0.1); color: var(--high); border: 1px solid rgba(0,200,83,0.2); }
.tag-intent-trap { background: rgba(255,82,82,0.1); color: var(--extreme); border: 1px solid rgba(255,82,82,0.2); }
.tag-intent-neutral { background: rgba(158,158,158,0.1); color: #9e9e9e; border: 1px solid rgba(158,158,158,0.2); }

/* ====== AI Recommendations Section ====== */
.rec-section { margin-top: 30px; }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.rec-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 20px;
}
.rec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rec-name { font-weight: 700; font-size: 0.95rem; }
.rec-risk { font-size: 0.75rem; padding: 3px 10px; border-radius: 4px; }
.rec-risk-low { background: rgba(0,200,83,0.15); color: var(--high); }
.rec-risk-mid { background: rgba(255,214,0,0.12); color: var(--medium); }
.rec-type { font-size: 0.78rem; color: var(--text-muted); }
.rec-match-item {
  background: #1e1e35; border-radius: 6px; padding: 10px 14px;
  margin-bottom: 8px; border-left: 3px solid var(--home);
}
.rec-match-item .teams { font-weight: 600; margin-bottom: 4px; }
.rec-match-item .teams .h { color: var(--home); } .rec-match-item .teams .a { color: var(--away); }
.rec-match-item .detail { font-size: 0.78rem; color: var(--text-muted); display: flex; gap: 12px; }
.rec-odds-display { text-align: center; margin-top: 10px; padding: 10px;
  background: #1f1f3a; border-radius: 6px; }
.rec-odds-display .combo { font-size: 1.3rem; font-weight: 700; color: var(--home); }
.rec-odds-display .ret { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

/* ====== Parlay Panel ====== */
.parlay-panel {
  position: fixed; right: 20px; top: 80px; width: 300px;
  max-height: calc(100vh - 120px);
  background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 12px; display: flex; flex-direction: column;
  z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}
.parlay-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.parlay-title { font-weight: 700; font-size: 0.95rem; }
.parlay-badge {
  background: var(--home); color: #fff; font-size: 0.7rem; padding: 2px 8px;
  border-radius: 10px; min-width: 20px; text-align: center;
}
.parlay-list { flex: 1; overflow-y: auto; padding: 8px 12px; max-height: 300px; }
.parlay-empty { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.85rem; }
.parlay-item {
  background: #1e1e38; border-radius: 6px; padding: 10px 12px;
  margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
  font-size: 0.82rem;
}
.parlay-item .info { flex: 1; min-width: 0; }
.parlay-item .match-teams-small { font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parlay-item .option-info { color: var(--text-muted); font-size: 0.75rem; }
.parlay-remove {
  background: none; border: none; color: var(--low); cursor: pointer;
  font-size: 1.1rem; padding: 0 4px; transition: all 0.2s;
}
.parlay-remove:hover { color: #ff5252; transform: scale(1.2); }
.parlay-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
.parlay-combo { text-align: center; margin-bottom: 10px; }
.parlay-combo .val { font-size: 1.15rem; font-weight: 700; color: var(--home); }
.parlay-combo .label { font-size: 0.7rem; color: var(--text-muted); }
.parlay-btns { display: flex; gap: 8px; }
.btn-clear {
  flex: 1; background: transparent; color: var(--low); border: 1px solid var(--low);
  padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; transition: all 0.2s;
}
.btn-clear:hover { background: rgba(255,23,68,0.1); }
.btn-generate {
  flex: 1; background: var(--home); color: #fff; border: none;
  padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
  transition: all 0.2s;
}
.btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-generate:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ====== Modal ====== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.65); z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
.modal-content {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; max-width: 500px; width: 90%;
  max-height: 80vh; overflow-y: auto;
}
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
.modal-match {
  background: #1e1e35; border-radius: 6px; padding: 10px 14px;
  margin-bottom: 8px;
}
.modal-match .teams { font-weight: 600; }
.modal-match .detail { font-size: 0.8rem; color: var(--text-muted); }
.modal-summary { text-align: center; margin-top: 16px; padding: 14px;
  background: #1f1f3a; border-radius: 8px; }
.modal-summary .odds { font-size: 1.4rem; font-weight: 700; color: var(--home); }
.modal-summary .info { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
.modal-close {
  display: block; width: 100%; margin-top: 16px; background: var(--btn-bg);
  color: var(--text); border: 1px solid var(--border); padding: 10px;
  border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
}
.modal-close:hover { background: var(--btn-hover); }

/* ====== Footer ====== */
.footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 0.78rem;
  border-top: 1px solid var(--border); margin-top: 40px; }
.footer .disclaimer { color: #ff5252; font-weight: 500; margin-bottom: 6px; }

/* ====== Loading ====== */
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border);
  border-top-color: var(--home); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== Scrollbar ====== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }

/* ====== Mobile ====== */
@media (max-width: 900px) {
  .main-container { padding: 16px; padding-bottom: 100px; }
  .content-area { margin-right: 0; }
  .match-card { flex-direction: column; gap: 12px; }
  .match-left, .match-center, .match-right { flex: none; }
  .match-left { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; }
  .match-teams { font-size: 1rem; }
  .rec-grid { grid-template-columns: 1fr; }
  .header { padding: 10px 16px; }
  .header .stats { gap: 12px; }

  .parlay-panel {
    position: fixed; right: 0; top: auto; bottom: 0; left: 0;
    width: 100%; max-height: 45vh; border-radius: 16px 16px 0 0;
    border-bottom: none;
  }
  .parlay-panel .parlay-list { max-height: 150px; }
}
@media (max-width: 480px) {
  .odds-btn { padding: 6px 10px; font-size: 0.8rem; min-width: 50px; }
  .odds-btn .val { font-size: 0.9rem; }
  .match-left { flex: 0 0 auto; }
  .odds-row { gap: 6px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">竞彩足球智能分析</div>
  <div class="stats">
    <div class="stat-item"><span class="dot"></span>数据更新：<span id="updateTime">--</span></div>
    <div class="stat-item">赛事总数：<span id="totalMatches">0</span> 场</div>
    <div class="stat-item">AI近10场命中率：<span id="hitRate">--</span></div>
    <button class="btn-refresh" onclick="refreshData()">手动刷新</button>
  </div>
</div>

<div class="main-container">
  <div class="content-area">
    <div class="section-title">赛事数据看板</div>
    <div id="matchesContainer"><div class="loading"><div class="spinner"></div><p style="margin-top:10px">加载赛事数据...</p></div></div>
    <div class="rec-section">
      <div class="section-title">AI 串关推荐</div>
      <div id="recContainer"><div class="loading">加载推荐方案...</div></div>
    </div>
  </div>
</div>

<div class="parlay-panel" id="parlayPanel">
  <div class="parlay-header">
    <span class="parlay-title">我的串关</span>
    <span class="parlay-badge" id="parlayCount">0</span>
  </div>
  <div class="parlay-list" id="parlayList">
    <div class="parlay-empty">点击赔率数字添加比赛</div>
  </div>
  <div class="parlay-footer">
    <div class="parlay-combo">
      <div class="val" id="comboOdds">--</div>
      <div class="label">组合赔率</div>
    </div>
    <div class="parlay-btns">
      <button class="btn-clear" onclick="clearParlay()">清空</button>
      <button class="btn-generate" id="btnGenerate" disabled onclick="generatePlan()">生成方案</button>
    </div>
  </div>
</div>

<div class="footer">
  <p class="disclaimer">免责声明：本网站所有数据及分析仅供娱乐参考，不构成任何投注建议。请理性对待，适度娱乐。</p>
  <p>&copy; 2024 竞彩足球智能分析 Demo</p>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
  <div class="modal-content" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<script>
// ====== 全局状态 ======
let currentMatches = [];
let parlaySelections = {};
let autoRefreshTimer = null;

// ====== API 调用 ======
async function fetchData() {
  const resp = await fetch('/api/data');
  if (!resp.ok) throw new Error('Network error');
  return await resp.json();
}

// ====== 渲染函数 ======
function renderMatches(matches) {
  currentMatches = matches;
  const container = document.getElementById('matchesContainer');
  if (!matches.length) {
    container.innerHTML = '<div class="loading">暂无赛事数据</div>';
    return;
  }
  container.innerHTML = matches.map(m => {
    const ouCls = m.over_under_tendency === '大球倾向' ? 'tag-over'
      : m.over_under_tendency === '小球倾向' ? 'tag-under' : 'tag-balance';
    const confCls = m.confidence_level === '高' ? 'tag-high'
      : m.confidence_level === '中' ? 'tag-medium' : 'tag-low';
    const hotCls = m.hotness_label === '适度热门' ? 'tag-moderate'
      : m.hotness_label === '极端热门' ? 'tag-extreme' : 'tag-cold';
    const intentCls = m.bookmaker_intent === '真实防范' ? 'tag-intent-real'
      : m.bookmaker_intent === '诱盘' ? 'tag-intent-trap' : 'tag-intent-neutral';

    return `
    <div class="match-card">
      <div class="match-left">
        <div class="match-meta">
          <span class="match-id">#${m.match_id}</span>
          <span class="match-league">${m.league}</span>
        </div>
        <div class="match-teams">
          <span class="home">${m.home_team}</span>
          <span class="vs">vs</span>
          <span class="away">${m.away_team}</span>
        </div>
        <div class="match-time">${m.match_time} 开赛</div>
      </div>
      <div class="match-center">
        <div class="odds-row">
          ${renderOddsBtn(m, '胜', m.win_odds)}
          ${renderOddsBtn(m, '平', m.draw_odds)}
          ${renderOddsBtn(m, '负', m.lose_odds)}
        </div>
        <div class="match-extras">
          <span class="handicap-badge">让球 ${m.handicap}</span>
          <span class="rec-score">推荐比分 ${m.recommended_score}</span>
        </div>
      </div>
      <div class="match-right">
        <div class="tag-row">
          <span class="tag ${confCls}">${m.confidence_level}信心</span>
          <span class="tag ${ouCls}">${m.over_under_tendency}</span>
        </div>
        <div class="tag-row">
          <span class="tag ${hotCls}">${m.hotness_label}</span>
          <span class="tag ${intentCls}">${m.bookmaker_intent}</span>
        </div>
        <div class="tag-row">
          <span class="tag" style="background:#252545;color:#b0b0d0;border:1px solid #3a3a5a;">预期 ${m.expected_goals} 球</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderOddsBtn(match, option, odds) {
  const sel = parlaySelections[match.match_id];
  const isSelected = sel && sel.option === option;
  return `
  <div class="odds-btn${isSelected ? ' selected' : ''}"
       onclick="toggleOdds('${match.match_id}','${option}',${odds},'${match.home_team}','${match.away_team}','${match.league}','${match.match_time}')">
    <span class="label">${option}</span>
    <span class="val">${odds}</span>
  </div>`;
}

function renderRecommendations(recs) {
  const container = document.getElementById('recContainer');
  if (!recs || !recs.length) {
    container.innerHTML = '<div class="loading">暂无推荐方案</div>';
    return;
  }
  container.innerHTML = '<div class="rec-grid">' + recs.map(r => {
    const riskCls = r.risk_level === '低风险' ? 'rec-risk-low' : 'rec-risk-mid';
    return `
    <div class="rec-card">
      <div class="rec-header">
        <div>
          <div class="rec-name">${r.name}</div>
          <div class="rec-type">${r.plan_type}</div>
        </div>
        <span class="rec-risk ${riskCls}">${r.risk_level}</span>
      </div>
      ${(r.matches_detail || []).map(md => `
      <div class="rec-match-item">
        <div class="teams">
          <span class="h">${md.home_team}</span> vs <span class="a">${md.away_team}</span>
          <span style="font-size:0.75rem;color:var(--text-muted);margin-left:6px;">${md.league} #${md.match_id}</span>
        </div>
        <div class="detail">
          <span>推荐: <strong style="color:var(--home)">${md.option}</strong> @${md.odds}</span>
          <span>${md.hotness_label} | ${md.bookmaker_intent}</span>
        </div>
      </div>`).join('')}
      <div class="rec-odds-display">
        <div class="combo">组合赔率 ${r.combo_odds}</div>
        <div class="ret">${r.expected_return}</div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

function renderParlay() {
  const list = document.getElementById('parlayList');
  const count = document.getElementById('parlayCount');
  const comboEl = document.getElementById('comboOdds');
  const btnGen = document.getElementById('btnGenerate');

  const items = Object.values(parlaySelections);
  count.textContent = items.length;

  if (items.length === 0) {
    list.innerHTML = '<div class="parlay-empty">点击赔率数字添加比赛</div>';
    comboEl.textContent = '--';
    btnGen.disabled = true;
  } else {
    list.innerHTML = items.map(item => `
    <div class="parlay-item">
      <div class="info">
        <div class="match-teams-small">${item.home_team} vs ${item.away_team}</div>
        <div class="option-info">#${item.match_id} ${item.league} | ${item.option} @${item.odds}</div>
      </div>
      <button class="parlay-remove" onclick="removeParlayItem('${item.match_id}')" title="移除">x</button>
    </div>`).join('');

    const combo = items.reduce((acc, item) => acc * item.odds, 1);
    comboEl.textContent = combo.toFixed(2);
    btnGen.disabled = items.length < 2;
  }

  // 重新渲染比赛卡片中的赔率选中状态
  if (currentMatches.length) renderMatches(currentMatches);
}

// ====== 串关操作 ======
function toggleOdds(matchId, option, odds, homeTeam, awayTeam, league, matchTime) {
  if (parlaySelections[matchId] && parlaySelections[matchId].option === option) {
    // 取消选中
    delete parlaySelections[matchId];
  } else {
    // 选中或替换
    parlaySelections[matchId] = { match_id: matchId, option, odds, home_team: homeTeam, away_team: awayTeam, league, match_time: matchTime };
  }
  renderParlay();
}

function removeParlayItem(matchId) {
  delete parlaySelections[matchId];
  renderParlay();
}

function clearParlay() {
  parlaySelections = {};
  renderParlay();
}

function generatePlan() {
  const items = Object.values(parlaySelections);
  if (items.length < 2) return;

  const comboOdds = items.reduce((acc, item) => acc * item.odds, 1);
  const expectedReturn = (comboOdds * 2).toFixed(2);

  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <div class="modal-title">串关方案详情</div>
    ${items.map((item, i) => `
    <div class="modal-match">
      <div class="teams">
        <span style="color:var(--home)">${item.home_team}</span> vs <span style="color:var(--away)">${item.away_team}</span>
      </div>
      <div class="detail">
        #${item.match_id} ${item.league} | ${item.match_time} |
        选择: <strong style="color:var(--home)">${item.option}</strong> @${item.odds}
      </div>
    </div>`).join('')}
    <div class="modal-summary">
      <div class="odds">组合赔率: ${comboOdds.toFixed(2)}</div>
      <div class="info">投注2元预计返奖: <strong style="color:var(--home)">${expectedReturn}元</strong></div>
      <div class="info" style="margin-top:8px;font-size:0.75rem;color:var(--text-muted)">共 ${items.length} 串 1 组合</div>
    </div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('modalOverlay').style.display = 'none';
}

// ====== 数据刷新 ======
async function refreshData() {
  try {
    document.getElementById('matchesContainer').innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:10px">刷新数据中...</p></div>';
    document.getElementById('recContainer').innerHTML = '<div class="loading">加载推荐方案...</div>';

    const data = await fetchData();
    document.getElementById('updateTime').textContent = data.stats.update_time;
    document.getElementById('totalMatches').textContent = data.stats.total_matches;
    document.getElementById('hitRate').textContent = data.stats.hit_rate;

    renderMatches(data.matches);
    renderRecommendations(data.recommendations);
    renderParlay();
  } catch (err) {
    document.getElementById('matchesContainer').innerHTML = '<div class="loading" style="color:var(--low)">数据加载失败，请稍后重试</div>';
  }
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(refreshData, 120000); // 2分钟
}

// ====== 键盘快捷关闭 Modal ======
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('modalOverlay').style.display = 'none';
});

// ====== 启动 ======
refreshData().then(startAutoRefresh);
</script>

</body>
</html>
